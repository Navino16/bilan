services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_DATABASE: budget
      MARIADB_USER: app
      MARIADB_PASSWORD: app_password
    command:
      - --innodb-encrypt-tables=ON
      - --innodb-encrypt-log=ON
      - --plugin-load-add=file_key_management
      - --file-key-management-filename=/etc/mysql/keyring/keyfile
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/conf.d:/etc/mysql/conf.d:ro
      - ./docker/mariadb/keyring:/etc/mysql/keyring:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  mariadb-test:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_DATABASE: budget_test
      MARIADB_USER: app
      MARIADB_PASSWORD: app_password
    ports:
      - "3307:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mariadb
    depends_on:
      mariadb:
        condition: service_healthy

  app:
    build:
      context: .
      target: dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://app:app_password@mariadb:3306/budget
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data:
