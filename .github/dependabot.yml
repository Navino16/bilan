version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    open-pull-requests-limit: 20
    groups:
      ci-dependencies:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    open-pull-requests-limit: 20
    # @types/node tracks the Node runtime major (24.x; see engines.node in
    # package.json). TypeScript 7 isn't supported by typescript-eslint yet.
    # Same rule as .ncurc.cjs: block their major updates.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      code-dependencies:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    open-pull-requests-limit: 20
    groups:
      docker-dependencies:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
