name: Close linked issues on develop merge

# GitHub only auto-closes issues from closing keywords when a PR merges into the
# DEFAULT branch (main). Our feature PRs target `develop`, so this workflow closes
# the referenced issues when a PR is merged into `develop`.
#
# Security note: the PR body is read via the `context` object inside github-script
# (JavaScript), never interpolated into a shell `run:` step — so it is injection-safe.

on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-26.04
    steps:
      - name: Close issues referenced in the PR body
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const prNumber = context.payload.pull_request.number;
            const re = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            const ids = new Set();
            let m;
            while ((m = re.exec(body)) !== null) ids.add(Number(m[1]));
            if (ids.size === 0) {
              core.info("No closing keywords found in PR body.");
              return;
            }
            for (const issue_number of ids) {
              core.info(`Closing #${issue_number}`);
              await github.rest.issues.update({
                ...context.repo,
                issue_number,
                state: "closed",
                state_reason: "completed",
              });
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body: `Closed by #${prNumber} (merged into \`develop\`).`,
              });
            }
